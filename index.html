<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triskelis Art</title>

  <style>
    body {
      margin: 0;
      background: black;
      font-family: "Book Antiqua", serif;
    }

    .page-wrapper {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      background: black;
    }

    .hero-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* SINGLE OVERLAY CONTAINER */
    .overlay-content {
      position: absolute;
      top: 68%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      z-index: 2;
      width: 100%;
    }

    .nav-links {
      display: flex;
      gap: 60px;
      flex-wrap: nowrap;
      justify-content: center;
    }

    .nav-links a {
      color: #00aaff;
      text-decoration: none;
      font-size: 72px;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(0, 170, 255, 0.6);
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      text-shadow:
        0 0 18px rgba(0, 170, 255, 1),
        0 0 30px rgba(0, 170, 255, 0.8);
    }

    .contact-link a {
      color: #00aaff;
      text-decoration: none;
      font-size: 20pt;
      text-shadow: 0 0 8px rgba(0, 170, 255, 0.6);
      transition: all 0.3s ease;
    }

    .contact-link a:hover {
      text-shadow:
        0 0 18px rgba(0, 170, 255, 1),
        0 0 30px rgba(0, 170, 255, 0.8);
    }

    /* TABLET */
    @media (max-width: 1100px) {

      .overlay-content {
        top: 70%;
        gap: 22px;
      }

      .nav-links {
        gap: 35px;
      }

      .nav-links a {
        font-size: 54px;
      }
    }

    /* MOBILE */
    @media (max-width: 768px) {

      .overlay-content {
        top: 72%;
        gap: 18px;
      }

      .nav-links {
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .nav-links a {
        font-size: 36px;
      }

      .contact-link a {
        font-size: 18pt;
      }
    }
  </style>
</head>

<body>

  <div class="page-wrapper">

    <img
      src="resources/FullPageMock3.jpg"
      alt="Triskelis Art homepage"
      class="hero-image"
    >

    <!-- SINGLE RESPONSIVE OVERLAY -->
    <div class="overlay-content">

      <div class="nav-links">
        <a href="artwork.html">ARTWORK</a>
        <a href="information.html">INFORMATION</a>
        <a href="patronage.html">PATRONAGE</a>
      </div>

      <div class="contact-link">
        <a id="contact-email" href="#">CONTACT</a>
      </div>

    </div>

  </div>

  <!-- Email Obfuscation Script -->
  <script>
    const user = "triskelisart";
    const domain = "gmail.com";
    const emailLink = document.getElementById("contact-email");

    emailLink.href = "mailto:" + user + "@" + domain;
  </script>

</body>
</html>
